<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FC Internal Tools</title>
    <script>
      // GitHub Pages SPA redirect
      // Captures the path the user tried to hit and redirects to the
      // app root with the path stored in sessionStorage so React can
      // pick it up after load.
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/fc-internal-tools/'">
  </head>
  <body>
    Redirecting to <a href="/fc-internal-tools/">FC Internal Tools</a>...
  </body>
</html>
